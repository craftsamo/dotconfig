set -g default-terminal "tmux-256color"

# True color (24-bit) for outer terminals (Ghostty sets TERM=xterm-ghostty)
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'

# Preserve modified Enter keys so TUI apps can distinguish Shift+Enter.
set -g extended-keys always
set -as terminal-features ',*:extkeys'

# Always use vertical bar cursor (tmux 3.4+)
# Also allow nested apps (nvim) to change the cursor shape via Ss/Se
set -g cursor-style bar
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

set-window-option -g mode-keys vi

#bind t send-key C-t
# Reload settings

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory in Finder
bind f run-shell "open '#{pane_current_path}'"
bind -r e kill-pane -a

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
# mouse: wheel scroll (enters copy-mode), pane select, resize panes
set -g mouse on
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
# Active pane keeps the terminal default fg; inactive panes are slightly dimmed
set -g window-style "fg=#8a94a6,bg=default"
set -g window-active-style "fg=default,bg=default"
set-option -g history-limit 64096

set -sg escape-time 10

# Colors are defined in statusline.conf (Neon Dark palette, matches Ghostty)

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf
