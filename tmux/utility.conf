# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w95% -h95% -E lazygit

# Run opencode in a separate session (one per project path). The TUI finds or
# starts OpenCode 2's shared background service itself.
bind o run-shell '\
  SESSION="opencode-$(printf "%s\n" #{q:pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
    tmux new-session -d -s "$SESSION" -c #{q:pane_current_path} \
      "$HOME/.config/bin/opencode" #{q:pane_current_path} \
      2>/dev/null || tmux has-session -t "$SESSION" 2>/dev/null || exit 1; \
  tmux display-popup -w95% -h95% -E "tmux attach-session -t $SESSION"'

# Reload OpenCode configuration for every project the service has loaded
bind O confirm-before -p 'Reload OpenCode config for all projects (cancels pending prompts)? (y/n)' \
  'run-shell -b "\"$HOME/.config/bin/opencode\" reload >/dev/null 2>&1 \
    && tmux display-message \"Reloaded OpenCode configuration\" \
    || tmux display-message -d 5000 \"OpenCode reload failed\""'

# Run hermes in a separate session (one per project path). Also lazily starts
# the shared, tailnet-only web dashboard in the background (non-blocking) so
# mobile devices can reach it — see hermes-dashboard.zsh.
bind H run-shell '\
  tmux run-shell -b "$HOME/.config/tmux/hermes-dashboard.zsh"; \
  SESSION="hermes-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "$HOME/.config/bin/hermes --tui"; \
  tmux display-popup -w95% -h95% -E "tmux attach-session -t $SESSION"'
