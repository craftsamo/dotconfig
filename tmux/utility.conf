# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w95% -h95% -E lazygit

# Run opencode in a separate session (one per project path)
bind o run-shell '\
  SESSION="opencode-$(printf "%s\n" #{q:pane_current_path} | md5sum | cut -c1-8)"; \
  if tmux has-session -t "$SESSION" 2>/dev/null; then \
    tmux run-shell -b "$HOME/.config/tmux/opencode-web.zsh"; \
  else \
    "$HOME/.config/tmux/opencode-web.zsh" || exit 1; \
    tmux new-session -d -s "$SESSION" -c #{q:pane_current_path} \
      "$HOME/.config/bin/opencode" attach http://127.0.0.1:4096 --dir #{q:pane_current_path} \
      2>/dev/null || tmux has-session -t "$SESSION" 2>/dev/null || exit 1; \
  fi; \
  tmux display-popup -w95% -h95% -E "tmux attach-session -t $SESSION"'

# Reload the OpenCode instance for the current project only
bind O confirm-before -p 'Reload idle OpenCode project at #{pane_current_path}? (y/n)' \
  'run-shell -b "$HOME/.config/tmux/opencode-project-reload.zsh #{q:pane_current_path}"'

# Run hermes in a separate session (one per project path)
bind H run-shell '\
  SESSION="hermes-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "$HOME/.config/bin/hermes --tui"; \
  tmux display-popup -w95% -h95% -E "tmux attach-session -t $SESSION"'
