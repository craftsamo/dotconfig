# Workflow v5 — machine-readable contract.
# Authority for the roster, tiers, modes, grants, and card/session schemas.
# Prose lives in SKILL.md and the capability references; scripts and the
# validator read THIS file. Keep it small: every key here is enforced
# somewhere or consumed by a tool — do not accumulate aspirational schema.

version: 2

orchestration:
  front_door: assistant
  modes:
    - chat
    - plan
    - execute
    - qa
  tiers:
    - inline
    - resident
    - kanban
  default_heavy_tier: resident
  approval_gates:
    - plan
  card_registration_owner: assistant
  worker_card_creation: forbidden
  qa_owner: assistant

specialists:
  creator:
    capability: creative
    pipeline: creator-pipeline
    grant: budget
  writer:
    capability: writing
    pipeline: writer-pipeline
    grant: null
  researcher:
    capability: research
    pipeline: researcher-pipeline
    grant: null
  searcher:
    capability: research
    pipeline: searcher-pipeline
    grant: null
  engineer:
    capability: engineering
    pipeline: engineer-pipeline
    grant: authority
  marketer:
    capability: marketing
    pipeline: marketer-pipeline
    grant: publish

grants:
  authority:
    presets: [A1, A2, A3]
    default: A1
  budget:
    default: creator_defaults
  publish:
    presets: [P1]
    default: draft_only

resident_session:
  wrapper: assistant/scripts/resident-session.sh
  registry: resident-sessions
  turn_execution: background_notify
  serialization: per_key_lock
  lifecycle: close_on_acceptance
  brief_fields:
    required:
      - goal
      - context
      - inputs
      - deliverable
      - constraints
    optional:
      - budget
      - authority
      - publish

kanban:
  uses:
    - fire_and_forget
    - cron
    - mass_parallel
    - scheduled
  card_fields:
    required:
      - goal
      - inputs
      - deliverable
      - constraints
    optional:
      - budget
      - authority
      - publish
  pipeline_pin: required
  block_resolver: assistant/scripts/kanban-resolve-block.sh
  scheduled_sweeper: assistant/scripts/kanban-scheduled-sweeper.sh
  retired_markers:
    - ORCHESTRATION_PENDING
    - ORCHESTRATION_PENDING_OVERLAY
    - FAN_OUT_READY
    - QA_PENDING_MATERIALIZATION
    - QA_MATERIALIZED
    - QA_HANDLED
    - COMPLETION_HANDLED
    - CONTRACT_INVALID
