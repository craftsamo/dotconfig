name: telegram-tools-guard
version: 1.0.0
description: >-
  Guard for the third-party telegram-tools plugin. Blocks its writes where no
  person can answer an approval card and for inbound A2A requests, and blocks
  the terminal and file tools from reaching the Telegram account around its
  tools (its CLI, state, logs and launch agents, and Telegram
  Desktop's data).
kind: standalone
