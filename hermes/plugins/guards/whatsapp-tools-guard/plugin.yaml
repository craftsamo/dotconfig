name: whatsapp-tools-guard
version: 1.0.0
description: >-
  Guard for the third-party whatsapp-tools plugin. Blocks its writes where no
  person can answer an approval card and for inbound A2A requests, and blocks
  the terminal and file tools from reaching the WhatsApp account around its
  tools (its CLI and wacli, state, logs and launch agents, and WhatsApp
  Desktop's data).
kind: standalone
