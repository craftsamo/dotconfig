name: cloudflare-tools-guard
version: 1.0.0
description: >-
  Guard for the third-party cloudflare-tools plugin. Blocks its writes where no
  person can answer an approval card and for inbound A2A requests, and blocks
  the terminal and file tools from reaching Cloudflare around its tools (the
  Cloudflare CLIs and API, the tokens in the process environment and the
  Keychain, the package's CLI, state and install).
kind: standalone
