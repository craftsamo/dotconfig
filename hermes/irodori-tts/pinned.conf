# Pinned versions for the local Irodori-TTS engine.
#
# Named .conf, not .env, on purpose: the repo gitignores **/*.env to keep
# secrets out, and these pins must be tracked. Nothing secret belongs here --
# the engine is loopback-only and takes no API key.
#
# The server is installed from a git checkout rather than a hash-locked
# requirements file, because upstream ships a uv.lock and pulls Irodori-TTS
# itself in as a git dependency. Pinning the server commit therefore pins the
# whole dependency graph, and `uv sync --frozen` refuses to move off uv.lock.
#
# Bump deliberately: re-run `launchd/irodori-tts-launchctl.sh install` afterwards
# so the venv and plist are rebuilt against the new pin.

IRODORI_SERVER_REPO=https://github.com/Aratako/Irodori-TTS-Server.git
IRODORI_SERVER_REV=841fb7c6ec57729c56b9b75c0ef2562249b13a10

# Verified working on macOS 26 / Apple Silicon. `cpu` is the correct extra here:
# its PyTorch index override is marked linux/win32 only, so on darwin uv resolves
# torch from PyPI, which is the MPS-capable build.
IRODORI_BACKEND_EXTRA=cpu
IRODORI_PYTHON_VERSION=3.10

# Model. bf16 is CUDA/XPU-only in Irodori-TTS, so Apple Silicon must run fp32.
IRODORI_HF_CHECKPOINT=Aratako/Irodori-TTS-v4.1-Small
IRODORI_CODEC_REPO=Aratako/Semantic-DACVAE-Japanese-32dim
IRODORI_MODEL_DEVICE=mps
IRODORI_CODEC_DEVICE=cpu
IRODORI_PRECISION=fp32

IRODORI_PORT=10103
