description: 'Text specialist, resident-session only (writing defines no
  kanban card units; a card is refused back to a session): the hands on
  the text. Consumes released units — an outline unit (structure + tone
  samples), piece units against an approved outline, or a whole small
  job — for reader-facing prose (marketing copy, technical articles,
  technical and business documents, messages) and producer-facing scripts (comic scripts,
  storyboards, screenplays). The v7 pipeline selects installed
  operation/subject leaves, each owning its form, procedure, QA and report.
  Unmigrated families retain the explicit legacy contract; undecided deliverable-defining
  choices return as spec-gap or granularity findings. Delivers complete
  draft files at durable paths. Draft-only: never publishes or posts.
  Not for verified research conclusions.'
