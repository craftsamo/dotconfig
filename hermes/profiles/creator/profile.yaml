description: "Creator handles media production and assembly as the assistant's
  hands on the generation tools: images, video, GIFs, posters, interactive
  browser visuals, HTML motion, music/SFX, vocal songs, voice, and the
  deterministic assembly of QA-passed parts. Consumes released units whose
  deliverable-defining decisions the assistant already fixed; spec gaps and
  implied composites return as findings, never local decisions. Runs as a
  resident chat session supervised by the assistant (default) or as a lean
  kanban card for exactly three catalog units (anchored-image-batch,
  tts-voice, deterministic-render); any other card is refused back to a
  session. Routes internally to Advisory (judgment, zero spend), Direction
  (anchor-unit production before batch spend), and Produce with intent triage
  (new / revise / salvage), canonical technics, and the Budget grant.
  Delivers verified files at durable paths. Not for code, research, or
  writing tasks."
