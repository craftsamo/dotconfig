description: "Creator serves human and assistant clients through Plan, Build
  and Quality assurance. Fills forms for ImageCreator's still-image families,
  VideoCreator's short clips and AudioCreator's speech, delegates production,
  and returns durable artifacts with evidence and explicit QA gaps. Existing
  legacy technics cover other images, authored motion, diagrams and assembly
  of supplied parts. Music/SFX generation, vocal songs and standalone audio
  visualization are withdrawn pending concrete new families, not silently
  routed through external skills. Kanban is limited to anchored-image-batch
  and deterministic-render for legacy work; speech uses hands sessions,
  never a card. Not for code, research, script writing or publishing."
