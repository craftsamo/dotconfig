hooks: {}
hooks_auto_accept: false
personalities: {}
security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
  acked_advisories: []
  allow_lazy_installs: true
cron:
  wrap_response: false
  max_parallel_jobs: null
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 15
  failure_limit: 2
  worker_log_rotate_bytes: 2097152
  worker_log_backup_count: 1
  orchestrator_profile: ''
  default_assignee: ''
  max_in_progress_per_profile: null
  auto_decompose: false
  auto_decompose_per_tick: 3
  dispatch_stale_timeout_seconds: 14400
code_execution:
  mode: project
tools:
  tool_search:
    enabled: auto
    threshold_pct: 10
    search_default_limit: 5
    max_search_limit: 20
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
model_catalog:
  enabled: true
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
  ttl_hours: 1
  providers: {}
network:
  force_ipv4: false
gateway:
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
streaming:
  enabled: false
  transport: auto
  edit_interval: 0.8
  buffer_threshold: 24
  cursor: " \u2589"
  fresh_final_after_seconds: 60.0
sessions:
  auto_prune: false
  retention_days: 90
  vacuum_after_prune: true
  min_interval_hours: 24
  write_json_snapshots: false
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
    openclaw_residue_cleanup: true
    profile_build_offered: true
  profile_build: ask
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
lsp:
  enabled: true
  wait_mode: document
  wait_timeout: 5.0
  install_strategy: auto
  servers: {}
x_search:
  model: grok-4.20-reasoning
  timeout_seconds: 180
  retries: 2
secrets:
  bitwarden:
    enabled: false
    access_token_env: BWS_ACCESS_TOKEN
    project_id: ''
    cache_ttl_seconds: 300
    override_existing: true
    auto_install: true
    server_url: ''
paste_collapse_threshold: 5
paste_collapse_threshold_fallback: 5
paste_collapse_char_threshold: 2000
_config_version: 29
platform_toolsets:
  cli:
  - web
  - browser
  - terminal
  - file
  - vision
  - x_search
  - skills
  - todo
  - memory
  - clarify
  - delegation
  - cronjob
  - computer_use
  - kanban
  - specialist
  - no_mcp
  telegram:
  - web
  - browser
  - terminal
  - file
  - vision
  - x_search
  - skills
  - todo
  - memory
  - clarify
  - delegation
  - cronjob
  - computer_use
  - kanban
  - specialist
  - no_mcp
  discord:
  - web
  - browser
  - terminal
  - file
  - vision
  - x_search
  - skills
  - todo
  - memory
  - clarify
  - delegation
  - cronjob
