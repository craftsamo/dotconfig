description: 'Implements code by driving OpenCode: writes/edits files, runs tests
  and builds, works in git worktrees. Owns the GitHub flow end-to-end: specifies
  settled requirements into GitHub Issues (epic/sub-issue decomposition), works
  from existing Issues (PR with Closes #n), responds to PR review comments, and
  updates GitHub Projects boards — all writes via OpenCode. Confirms material
  decisions (plan approval, push/PR, dependency or architecture changes, Issue
  registration) with the orchestrator via kanban block/comment before proceeding.
  Best for concrete implementation and GitHub-flow tasks, not open-ended research.'
