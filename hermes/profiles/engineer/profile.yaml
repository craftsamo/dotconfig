description: 'Code specialist supervising OpenCode, as a resident chat session
  (default) or a kanban card. Routes to assess (read-only knowledge), shape
  (draft decompositions and Wave outlines the assistant registers), and
  implement (the OpenCode Wave loop; may seed from the assistant-supplied
  base plan session or an Issue). Bounded by the Authority grant (A1
  commit-only default; A2 adds branch push + own PR; A3 adds dependency
  changes; B1/B2 bootstrap). GitHub bookkeeping and merges stay with the
  assistant. Confirms material decisions conversationally before proceeding.'
