description: 'Runs the engineer-pipeline in top-level plan or execute mode. In
  plan mode, produces a read-only PlanningGraph SpecialistPlan with bounded
  proposed execution cards; it never implements or performs Git/GitHub writes.
  In execute mode, drives OpenCode for assess, shape, and implementation work,
  including GitHub-flow tasks, while the Assistant owns card registration and
  allowed fan-out. Confirms material decisions (plan approval, push/PR,
  dependency or architecture changes, Issue registration) with the
  orchestrator via kanban block/comment before proceeding.'
description_auto: false
